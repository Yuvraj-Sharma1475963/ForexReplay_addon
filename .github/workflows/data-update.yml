# Market data from Yahoo Finance, only when you start it: Actions -> Data update -> Run workflow
# (the website's "Update data" window links here). It fills the candles after the last MT5 one
# (data/EURUSD_M5_yahoo_fill.csv, which every MT5 file beats), then publishes the website again.
# Nothing runs on a schedule.
# Docs: docs/decisions/0018-daily-data-update.md
name: Data update

on:
  workflow_dispatch:

permissions:
  contents: write # commit the fill file
  actions: write # start the Website workflow (a push made here does not start it by itself)

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-site.txt
      - name: Fill missing candles from Yahoo Finance
        run: python -m forex_replay update --source yahoo
      - name: Commit, push and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then echo "Nothing new: the data is up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/EURUSD_M5_yahoo_fill.csv
          git commit -m "Data: Yahoo fill for the hours without an MT5 update"
          git push
          gh workflow run pages.yml --ref main
